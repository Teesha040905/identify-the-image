# Generated by DeployPilot (template v3) for project 'identify-the-image', environment 'dev'.
# Deploys on every push to 'dev'. Edit it in DeployPilot; changes made here are
# replaced the next time DeployPilot updates this file.
# Pinned actions: actions/checkout v7.0.1, aws-actions/configure-aws-credentials v6.3.0, aws-actions/amazon-ecr-login v2.1.7, docker/setup-buildx-action v4.4.1
name: 'DeployPilot: deploy dev'
'on':
  push:
    branches:
    - dev
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploypilot-dev
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_DEV }}:${{ github.sha }}
      IMAGE_PARAMETER: ${{ vars.IMAGE_PARAMETER_DEV }}
      APP_URL: ${{ vars.APP_URL_DEV }}
      TARGET_TAG: identify-the-image-dev
      MAX_CONCURRENCY: 100%
      PLATFORM: linux/amd64
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: 'Sign in to AWS (OIDC: no stored keys)'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
        aws-region: ${{ vars.AWS_REGION_DEV }}
        role-session-name: deploypilot-identify-the-image-dev
        role-duration-seconds: 900
        mask-aws-account-id: true
    - name: Sign in to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build image
      run: docker buildx build --platform "$PLATFORM" -f "Dockerfile" -t "$IMAGE" --load .
    - name: Push image
      run: |
        if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
          echo "This commit's image is already in Amazon ECR (a re-run or a rollback): using it."
        else
          docker push "$IMAGE"
        fi
    - name: Release to instances (Systems Manager, no SSH)
      run: |
        aws ssm put-parameter --name "$IMAGE_PARAMETER" --type String --value "$IMAGE" --overwrite
        CMD_ID=$(aws ssm send-command --document-name AWS-RunShellScript \
          --targets "Key=tag:deploypilot-target,Values=$TARGET_TAG" \
          --max-concurrency "$MAX_CONCURRENCY" --max-errors 0 \
          --parameters 'commands=["/usr/local/bin/deploypilot-deploy"]' \
          --comment "DeployPilot ${GITHUB_SHA::12}" --query Command.CommandId --output text)
        echo "Systems Manager command: $CMD_ID"
        for attempt in $(seq 1 90); do
          STATUS=$(aws ssm list-commands --command-id "$CMD_ID" \
            --query "Commands[0].Status" --output text)
          case "$STATUS" in
            Success) echo "All instances updated."; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                --query "CommandInvocations[].{instance:InstanceId,status:Status,output:CommandPlugins[0].Output}"
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Timed out waiting for instances to update."; exit 1
    - name: Health check
      run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null "$APP_URL/health"
